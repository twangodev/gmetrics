name: Go

on:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - run: go test ./... -race
      - run: go vet ./...
      - run: go build ./...

  release-please:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            name: macos-amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            name: macos-arm64
            ext: ""
          - goos: windows
            goarch: amd64
            name: windows-amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            name: windows-arm64
            ext: ".exe"
          - goos: linux
            goarch: amd64
            name: linux-amd64
            ext: ""
          - goos: linux
            goarch: arm64
            name: linux-arm64
            ext: ""
          - goos: linux
            goarch: arm
            name: linux-arm
            ext: ""
          - goos: freebsd
            goarch: amd64
            name: freebsd-amd64
            ext: ""
          - goos: freebsd
            goarch: arm64
            name: freebsd-arm64
            ext: ""
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Set binary name
        run: echo "BINARY_NAME=gmetrics-${{ matrix.name }}${{ matrix.ext }}" >> $GITHUB_ENV

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o "${{ env.BINARY_NAME }}" ./cmd/gmetrics

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "${{ env.BINARY_NAME }}"

      - uses: actions/upload-artifact@v7
        with:
          name: gmetrics-${{ matrix.name }}
          path: gmetrics-*

  upload-release-assets:
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" artifacts/*
