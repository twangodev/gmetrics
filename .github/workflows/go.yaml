name: Go

on:
  push:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - run: go test ./... -race
      - run: go vet ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            name: macos-amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            name: macos-arm64
            ext: ""
          - goos: windows
            goarch: amd64
            name: windows-amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            name: windows-arm64
            ext: ".exe"
          - goos: linux
            goarch: amd64
            name: linux-amd64
            ext: ""
          - goos: linux
            goarch: arm64
            name: linux-arm64
            ext: ""
          - goos: linux
            goarch: arm
            name: linux-arm
            ext: ""
          - goos: freebsd
            goarch: amd64
            name: freebsd-amd64
            ext: ""
          - goos: freebsd
            goarch: arm64
            name: freebsd-arm64
            ext: ""
    steps:
      - uses: actions/checkout@v6

      - name: Set binary name
        run: echo "BINARY_NAME=gmetrics-${{ matrix.name }}-${{ github.ref_name }}${{ matrix.ext }}" >> $GITHUB_ENV

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o "${{ env.BINARY_NAME }}" ./cmd/gmetrics

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "${{ env.BINARY_NAME }}"

      - uses: actions/upload-artifact@v4
        with:
          name: gmetrics-${{ matrix.name }}
          path: gmetrics-*

  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/gmetrics-*
